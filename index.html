<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="icon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>Krillion Unlimited Answers</title>
</head>

<body>
    <div class="section add_pair">
        <h2>Add questions</h2>
        <input id="add_question_input" placeholder="Question"></input>
        <input id="add_answer_input" placeholder="Answer"></input>
        <button id="add_btn"><img src="images/submit.png" alt="" id="add_img">Submit!</button>
    </div>
    <div class="section find_pair">
        <h2>Find answers</h2>
        <input id="find_question_input" placeholder="Any word in a question"></input>
        <button id="find_btn"><img src="images/submit.png" alt="" id="find_img">Submit!</button>
    </div>
    <div class="answer_box">
        <p id="answer_text"></p>
    </div>
    <div class="display_box">
        <p id="display_text"></p>
        <img src="images/success.png" alt="X" id="tick">
    </div>

    <script src="script.js" type="module"></script>
</body>

</html>
