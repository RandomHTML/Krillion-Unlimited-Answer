<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="icon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>Krillion Unlimited Answers</title>
</head>

<body>
    <div class="section add_pair">
        <h2>Add questions</h2>
        <input id="add_question_input" placeholder="Question"></input>
        <input id="add_answer_input" placeholder="Answer"></input>
        <button id="add_questions_btn"><img src="images/submit.png" alt="">Submit!</button>
    </div>
    <div class="section find_pair">
        <h2>Find answers</h2>
        <input id="find_question_input" placeholder="Question"></input>
        <button id="find_questions_btn"><img src="images/submit.png" alt="">Submit!</button>
    </div>
    <div class="answer_box">
        <img src="images/exit.png" alt="X" id="exit">
        <p id="answer"></p>
    </div>

    <script src="script.js" type="module"></script>
</body>

</html>
